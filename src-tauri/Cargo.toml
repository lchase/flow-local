[package]
name = "flow-local"
version = "0.1.0"
description = "Local-first dictation with on-device STT and Ollama cleanup"
authors = ["Lawrence Chase"]
edition = "2021"

[lib]
name = "flow_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
thiserror = "2"

# Audio capture + resampling
cpal = "0.16"
rubato = "0.16"

# STT: Parakeet (ONNX) + whisper.cpp
transcribe-rs = { version = "0.3", features = ["onnx", "whisper-cpp"] }
tauri-plugin-autostart = "2"

# Text injection
enigo = "0.6"

# Model download + Ollama client
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-rs = { version = "0.3", features = ["whisper-metal"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
macos-accessibility-client = "0.0.1"

# Raw global key listener (bare-modifier + combo hotkeys; global-hotkey/rdev can't do
# bare modifiers, and rdev's listen() crashes on real keypresses off the main thread —
# see hotkey.rs doc comment).
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
